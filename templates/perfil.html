{% extends "base.html" %}

{% block title %}Meu Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="auth-icon-circle login">
            <i class="bi bi-person-circle text-primary fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark h3">Alterar Senha</h2>
          <p class="text-muted small">Atualize sua senha de acesso</p>
        </div>

        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-medium text-dark small">Senha atual</label>
            <input type="password" name="senha_atual" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium text-dark small">Nova senha (mín. 4 caracteres)</label>
            <input type="password" name="nova_senha" class="form-control" required minlength="4">
          </div>
          <div class="mb-3">
            <label class="form-label fw-medium text-dark small">Confirmar nova senha</label>
            <input type="password" name="confirmacao" class="form-control" required minlength="4">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">Salvar nova senha</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
