{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    
    <!-- Cartão de Cadastro -->
    <div class="card shadow-sm border-0 rounded-4 my-4">
      <div class="card-body p-4 p-md-5">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-circle mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-person-plus-fill text-success fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark h3">Criar Conta</h2>
          <p class="text-muted small">Junte-se à Agenda SC para gerenciar seus compromissos</p>
        </div>

        <!-- Formulário -->
        <form method="post">
          
          <!-- Usuário -->
          <div class="mb-3">
            <label class="form-label fw-medium text-dark small">Usuário</label>
            <div class="input-group input-group-lg shadow-sm">
              <span class="input-group-text bg-white text-muted border-end-0">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" name="username" class="form-control border-start-0 ps-0" required autocomplete="off" placeholder="Escolha um nome de usuário" autofocus>
            </div>
          </div>

          <!-- Campos de Senha (Lado a lado em telas maiores) -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-medium text-dark small">Senha</label>
              <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white text-muted border-end-0">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="senha" class="form-control border-start-0 ps-0" required minlength="4" placeholder="Mín. 4 caracteres">
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-medium text-dark small">Confirmar Senha</label>
              <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white text-muted border-end-0">
                  <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" name="confirmar_senha" class="form-control border-start-0 ps-0" required minlength="4" placeholder="Repita a senha">
              </div>
            </div>
          </div>

          <!-- Cidade -->
          <div class="mb-4">
            <label class="form-label fw-medium text-dark small">Cidade de Atuação</label>
            <div class="input-group input-group-lg shadow-sm mb-1">
              <span class="input-group-text bg-white text-muted border-end-0">
                <i class="bi bi-geo-alt"></i>
              </span>
              <input list="cidadesList" name="cidade" class="form-control border-start-0 ps-0" placeholder="Digite ou selecione a cidade" required autocomplete="off">
            </div>
            <!-- Datalist removido: usa o global do base.html -->
            <div class="form-text small text-muted">
              <i class="bi bi-info-circle me-1"></i>Obrigatória – você verá apenas os compromissos desta cidade.
            </div>
          </div>

          <!-- Botão de Cadastro -->
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-success btn-lg fw-semibold shadow-sm">
              Criar minha conta <i class="bi bi-check2-circle ms-1"></i>
            </button>
          </div>
          
        </form>

      </div>
    </div>
    
    <!-- Link de Voltar para Login -->
    <div class="text-center pb-4">
      <p class="text-muted">Já tem uma conta? <a href="{{ url_for('login') }}" class="text-success fw-semibold text-decoration-none">Faça login aqui</a></p>
    </div>

  </div>
</div>
{% endblock %}
