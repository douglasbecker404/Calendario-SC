{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-12 col-md-8 col-lg-5 col-xl-4">
    
    <!-- Cartão de Login -->
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-4">
          <div class="auth-icon-circle login">
            <i class="bi bi-calendar2-check-fill text-primary fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark h3">Acesso ao Sistema</h2>
          <p class="text-muted small">Faça login para gerenciar a Agenda SC</p>
        </div>

        <!-- Formulário -->
        <form method="post">
          
          <!-- Usuário -->
          <div class="mb-3">
            <label class="form-label fw-medium text-dark small">Usuário</label>
            <div class="input-group input-group-lg shadow-sm">
              <span class="input-group-text bg-white text-muted border-end-0">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" name="username" class="form-control border-start-0 ps-0" required autocomplete="off" placeholder="Digite seu usuário" autofocus>
            </div>
          </div>

          <!-- Senha -->
          <div class="mb-4">
            <label class="form-label fw-medium text-dark small">Senha</label>
            <div class="input-group input-group-lg shadow-sm">
              <span class="input-group-text bg-white text-muted border-end-0">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" name="senha" class="form-control border-start-0 ps-0" required placeholder="Digite sua senha">
            </div>
          </div>

          <!-- Botão de Login -->
          <div class="d-grid mt-2">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">
              Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>
          </div>
          
        </form>

      </div>
    </div>
    
    <!-- Link de Cadastro -->
    <div class="text-center mt-4">
      <p class="text-muted">Não tem conta? <a href="{{ url_for('cadastro') }}" class="text-primary fw-semibold text-decoration-none">Cadastre-se aqui</a></p>
    </div>

  </div>
</div>
{% endblock %}
